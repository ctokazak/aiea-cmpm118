# Task 2: the same training run as a Job. It exits when the script finishes,
# so it frees the GPU on its own. Never use `sleep infinity` in a Job.
apiVersion: batch/v1
kind: Job
metadata:
  name: ctokazak-task2-job
  namespace: aiea-auditors
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: trainer
          image: pytorch/pytorch:2.4.1-cuda12.1-cudnn9-runtime
          command: ["sh", "-c", "pip install -q matplotlib && cd /data && python cifar10train.py"]
          resources:
            requests: {cpu: "2", memory: 8Gi, nvidia.com/gpu: 1}
            limits:   {cpu: "2", memory: 8Gi, nvidia.com/gpu: 1}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: dshm, mountPath: /dev/shm}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: ctokazak-task2}
        - name: dshm
          emptyDir: {medium: Memory, sizeLimit: 2Gi}
